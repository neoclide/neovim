name: Dev

on:
  push:
    branches:
      - neoclide

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      matrix:
        versions:
          - neovim: "stable"
            vim: "v9.0.0815"
        node:
          - "20"

    env:
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Setup vim
        uses: rhysd/action-setup-vim@v1
        id: vim
        with:
          version: ${{ matrix.versions.vim }}

      - name: Setup neovim
        id: nvim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.versions.neovim }}

      - name: Install Dependencies
        run: |
          vim --version
          nvim --version
          npm ci
          npm run lint

      - name: Run jest
        env:
          VIM_COMMAND: ${{ steps.vim.outputs.executable }}
          NVIM_COMMAND: ${{ steps.nvim.outputs.executable }}
        run: |
          node --max-old-space-size=4096 --expose-gc ./node_modules/.bin/jest --maxWorkers=2
